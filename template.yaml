AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: >
  Per-user reminders with Amazon EventBridge Scheduler (blog sample).
  Deploys an end-to-end demo: the reminder-target Lambda, the two schedule groups
  (task-reminders, recurring-tasks), a least-privilege IAM role that lets
  EventBridge Scheduler invoke the function, a DynamoDB table for tasks, and an
  SNS topic for reminder delivery. The scheduling operations in
  src/scheduler_client.py create/update/delete schedules against these resources.

Globals:
  Function:
    Timeout: 10
    MemorySize: 128
    Runtime: python3.12

Resources:
  # Customer-managed KMS key (CMK) used to encrypt task data at rest in DynamoDB
  # and reminder messages in SNS. A CMK (rather than an AWS-owned key) lets you
  # control rotation and access, and satisfies encryption best practices.
  EncryptionKey:
    Type: AWS::KMS::Key
    Properties:
      Description: Encrypts the tasks table and reminder topic for the sample.
      EnableKeyRotation: true
      KeyPolicy:
        Version: "2012-10-17"
        Statement:
          - Sid: EnableAccountAdmin
            Effect: Allow
            Principal:
              AWS: !Sub "arn:aws:iam::${AWS::AccountId}:root"
            Action: "kms:*"
            Resource: "*"

  # DynamoDB table that stores tasks (partition key: task_id). Encrypted with the
  # customer-managed CMK, with point-in-time recovery enabled.
  TasksTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: task_id
          AttributeType: S
      KeySchema:
        - AttributeName: task_id
          KeyType: HASH
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      SSESpecification:
        SSEEnabled: true
        SSEType: KMS
        KMSMasterKeyId: !Ref EncryptionKey

  # SNS topic that reminders are published to. Subscribe an email or SMS
  # endpoint to receive delivered reminders. Encrypted with the CMK.
  ReminderTopic:
    Type: AWS::SNS::Topic
    Properties:
      KmsMasterKeyId: !Ref EncryptionKey

  # Dead-letter queue for the target Lambda: events that fail all retries land
  # here instead of being lost. Encrypted with the same CMK.
  ReminderDLQ:
    Type: AWS::SQS::Queue
    Properties:
      MessageRetentionPeriod: 1209600  # 14 days (maximum)
      KmsMasterKeyId: !Ref EncryptionKey

  # The Lambda that EventBridge Scheduler invokes when a reminder fires. It reads
  # the task from DynamoDB and publishes the reminder to the SNS topic.
  ReminderTargetFunction:
    Type: AWS::Serverless::Function
    # checkov:skip=CKV_AWS_117:This sample intentionally runs the function outside
    # a VPC. Placing it in a VPC would require VPC endpoints for DynamoDB, SNS,
    # and KMS and adds networking complexity that is unnecessary for a public
    # demo. Configure a VPC in your own environment if your data plane requires it.
    Properties:
      # No fixed FunctionName: let CloudFormation auto-name the function so the
      # stack can be deployed more than once per account/Region without name
      # collisions. Read the generated name from the ReminderFunctionName output.
      CodeUri: functions/reminder_target/
      Handler: app.lambda_handler
      Description: Reads the task from DynamoDB and publishes the reminder to SNS.
      # Cap concurrency so a burst of due reminders cannot exhaust the account's
      # Lambda pool. Tune this to your expected reminder volume.
      ReservedConcurrentExecutions: 10
      # Encrypt environment variables at rest with the customer-managed CMK.
      KmsKeyArn: !GetAtt EncryptionKey.Arn
      # Failed invocations are sent to the dead-letter queue for inspection.
      DeadLetterQueue:
        Type: SQS
        TargetArn: !GetAtt ReminderDLQ.Arn
      Environment:
        Variables:
          TASKS_TABLE: !Ref TasksTable
          REMINDER_TOPIC_ARN: !Ref ReminderTopic
      Policies:
        # Least-privilege: read a task, publish to only this topic, use the CMK
        # that encrypts everything, and send failed events to the DLQ. (SAM also
        # adds sqs:SendMessage for the DeadLetterQueue target automatically.)
        - Statement:
            - Effect: Allow
              Action: dynamodb:GetItem
              Resource: !GetAtt TasksTable.Arn
            - Effect: Allow
              Action: sns:Publish
              Resource: !Ref ReminderTopic
            - Effect: Allow
              Action:
                - kms:Decrypt
                - kms:GenerateDataKey
              Resource: !GetAtt EncryptionKey.Arn

  # Schedule group for one-time reminders.
  TaskRemindersGroup:
    Type: AWS::Scheduler::ScheduleGroup
    Properties:
      Name: task-reminders

  # Schedule group for recurring (cron) reminders.
  RecurringTasksGroup:
    Type: AWS::Scheduler::ScheduleGroup
    Properties:
      Name: recurring-tasks

  # Least-privilege role assumed by EventBridge Scheduler to invoke the target
  # Lambda. It can invoke only this one function ARN.
  SchedulerToLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: scheduler.amazonaws.com
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
      Policies:
        - PolicyName: InvokeReminderTarget
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: lambda:InvokeFunction
                Resource: !GetAtt ReminderTargetFunction.Arn

Outputs:
  ReminderFunctionArn:
    Description: Set this as REMINDER_FUNCTION_ARN for src/scheduler_client.py.
    Value: !GetAtt ReminderTargetFunction.Arn
  ReminderFunctionName:
    Description: Generated Lambda name (use for `aws logs tail /aws/lambda/<name>`).
    Value: !Ref ReminderTargetFunction
  SchedulerRoleArn:
    Description: Set this as SCHEDULER_ROLE_ARN for src/scheduler_client.py.
    Value: !GetAtt SchedulerToLambdaRole.Arn
  TasksTableName:
    Description: Set this as TASKS_TABLE for the scheduling code.
    Value: !Ref TasksTable
  ReminderTopicArn:
    Description: Set this as REMINDER_TOPIC_ARN. Subscribe an endpoint to receive reminders.
    Value: !Ref ReminderTopic
  TaskRemindersGroupName:
    Description: Schedule group for one-time reminders.
    Value: !Ref TaskRemindersGroup
  RecurringTasksGroupName:
    Description: Schedule group for recurring reminders.
    Value: !Ref RecurringTasksGroup
